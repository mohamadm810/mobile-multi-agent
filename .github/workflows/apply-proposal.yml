name: Apply Approved Patch Proposal

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: "Choose APPLY_TO_BRANCH only after reviewing the latest patch proposal"
        required: true
        type: choice
        default: REVIEW_ONLY
        options:
          - REVIEW_ONLY
          - APPLY_TO_BRANCH
      proposal_fingerprint:
        description: "Copy the exact SHA-256 proposal fingerprint from workspace/STATE.json"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

# Serialize this write workflow with the main agent workflow.
concurrency:
  group: multi-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review-only:
    if: github.event.inputs.authorization != 'APPLY_TO_BRANCH'
    runs-on: ubuntu-latest
    steps:
      - name: No changes authorized
        run: echo "Review-only selected. No patch was applied and no branch was created."

  apply:
    if: github.event.inputs.authorization == 'APPLY_TO_BRANCH'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Consume fingerprint-bound one-time approval on main
        env:
          PATCH_AUTHORIZATION: ${{ inputs.authorization }}
          PROPOSAL_FINGERPRINT: ${{ inputs.proposal_fingerprint }}
          APPROVAL_CONSUME_ONLY: "1"
        run: python -m agent.apply_proposal
      - name: Persist consumed approval before patching
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace/APPROVAL_LEDGER.json
          git commit -m "Consume one-time patch approval"
          gh auth setup-git
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Main branch moved during approval consumption; reconciling attempt $attempt"
            git fetch origin main
            git rebase origin/main
          done
          if [ "$pushed" -ne 1 ]; then
            echo "Could not persist one-time approval consumption"
            exit 1
          fi
          git fetch origin main
          git reset --hard origin/main
      - name: Create isolated patch branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Dispatch must originate from main"
            exit 1
          fi
          echo "PATCH_BRANCH=agent-work/patch-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          git switch -c "agent-work/patch-${GITHUB_RUN_ID}"
      - name: Apply the consumed, validated proposal
        env:
          PATCH_AUTHORIZATION: ${{ inputs.authorization }}
          PROPOSAL_FINGERPRINT: ${{ inputs.proposal_fingerprint }}
        run: python -m agent.apply_proposal
      - name: Pull isolated Python runtime
        run: |
          for attempt in 1 2 3; do
            if docker pull python:3.12-slim; then
              exit 0
            fi
            echo "Image pull failed on attempt $attempt"
            sleep $((attempt * 2))
          done
          echo "Could not obtain the isolated Python runtime"
          exit 1
      - name: Compile and test the proposed branch in a network-isolated container
        env:
          WORKSPACE_PATH: ${{ github.workspace }}
        run: |
          docker run --rm \
            --network none \
            --cpus 1 \
            --memory 2g \
            --pids-limit 128 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 65532:65532 \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --mount "type=bind,src=$WORKSPACE_PATH,dst=/workspace,readonly" \
            --workdir /workspace \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONUNBUFFERED=1 \
            --env HOME=/tmp \
            python:3.12-slim \
            python -c "from pathlib import Path; import subprocess, sys; files=list(Path('agent').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; result=subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-v'], check=False); sys.exit(result.returncode)"
      - name: Check diff and commit only allowlisted source directories
        run: |
          git diff --check
          git add -- agent/ tests/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "The approved proposal produced no changes"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply explicitly approved agent patch proposal"
      - name: Push isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BRANCH: ${{ env.PATCH_BRANCH }}
        run: |
          gh auth setup-git
          git push --set-upstream origin "$PATCH_BRANCH"
      - name: Open draft pull request for human review
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BRANCH: ${{ env.PATCH_BRANCH }}
        run: |
          gh pr create \
            --draft \
            --base main \
            --head "$PATCH_BRANCH" \
            --title "Approved agent patch ${GITHUB_RUN_ID}" \
            --body "This draft PR was created after an explicit one-run APPLY_TO_BRANCH authorization. The patch was path-validated and the fixed test suite passed in a read-only, network-isolated container. Review the complete diff and checks before merging. No automatic merge or deployment is performed."
      - name: Preserve uncommitted patch diff if execution fails
        if: failure()
        run: |
          mkdir -p workspace
          git diff --binary main -- agent/ tests/ > workspace/FAILED_PATCH.diff || true
      - name: Upload failed patch diff
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-agent-patch-${{ github.run_id }}
          path: workspace/FAILED_PATCH.diff
          if-no-files-found: warn
          retention-days: 14
