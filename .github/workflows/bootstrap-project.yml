name: Bootstrap project files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract project archive
        run: |
          set -euo pipefail
          test -f mobile_multi_agent_ready_to_upload.zip
          mkdir -p /tmp/project-archive
          unzip -q mobile_multi_agent_ready_to_upload.zip -d /tmp/project-archive
          test -d /tmp/project-archive/mobile_multi_agent
          cp -a /tmp/project-archive/mobile_multi_agent/. .
          # Workflow files are installed separately because the Actions token cannot
          # create or update workflow files without the dedicated workflows scope.
          rm -f .github/workflows/run-agent.yml .github/workflows/tests.yml
          rm mobile_multi_agent_ready_to_upload.zip
      - name: Commit extracted project
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Bootstrap multi-agent project structure"
            git push
          else
            echo "No changes to commit"
          fi
