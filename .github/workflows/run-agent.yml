name: Run Multi-Agent

on:
  workflow_dispatch:
  push:
    paths:
      - "workspace/REQUEST.md"
    branches: [main]

permissions:
  contents: write

concurrency:
  group: multi-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run seven-agent planning cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_FALLBACK_MODELS: gemini-3.8-flash
          MAX_OUTPUT_TOKENS: "1800"
          GEMINI_TIMEOUT_SECONDS: "60"
        run: python -m agent.run
      - name: Commit report and state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace/REPORT.md workspace/STATE.json
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "Update multi-agent planning report"

          # Rebase generated output onto the latest main before pushing.
          # Prefer this run's generated REPORT/STATE if another run updated them too.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              echo "Report and state committed to main"
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying after fetch/rebase"
          done
          echo "Could not publish report after three attempts"
          exit 1
      - name: Preserve report if publishing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multi-agent-report-${{ github.run_id }}
          path: |
            workspace/REPORT.md
            workspace/STATE.json
          if-no-files-found: warn
          retention-days: 14
