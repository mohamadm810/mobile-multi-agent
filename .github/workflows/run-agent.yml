name: Run Multi-Agent

on:
  workflow_dispatch:
  push:
    paths:
      - "workspace/REQUEST.md"
    branches: [main]

permissions:
  contents: write

concurrency:
  group: multi-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run eight-role planning and HR governance cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_FALLBACK_MODELS: gemini-3.8-flash
          MAX_OUTPUT_TOKENS: "1800"
          GEMINI_TIMEOUT_SECONDS: "60"
        run: python -m agent.run
      - name: Commit report and state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace/REPORT.md workspace/STATE.json
          if [ -f workspace/EVENTS.jsonl ]; then git add workspace/EVENTS.jsonl; fi
          # Keep resumable stage outputs across failed workflow reruns; stage deletion on success.
          if [ -f workspace/CHECKPOINT.json ]; then
            git add workspace/CHECKPOINT.json
          else
            git rm --cached --ignore-unmatch workspace/CHECKPOINT.json
          fi
          if [ -f workspace/PATCH_PROPOSAL.json ]; then
            git add workspace/PATCH_PROPOSAL.json
          else
            git rm --cached --ignore-unmatch workspace/PATCH_PROPOSAL.json
          fi
          if [ -f workspace/TEAM.json ]; then git add workspace/TEAM.json; fi
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "Update multi-agent planning report"

          # Rebase generated output onto the latest main before pushing.
          # Prefer this run's generated REPORT/STATE if another run updated them too.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              echo "Report and state committed to main"
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying after fetch/rebase"
          done
          echo "Could not publish report after three attempts"
          exit 1
      - name: Preserve report if publishing fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multi-agent-report-${{ github.run_id }}
          path: |
            workspace/REPORT.md
            workspace/STATE.json
            workspace/EVENTS.jsonl
            workspace/CHECKPOINT.json
            workspace/PATCH_PROPOSAL.json
          if-no-files-found: warn
          retention-days: 14
